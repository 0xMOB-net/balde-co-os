:root{font-family:Inter,system-ui,Arial;background:#080e1c;color:#e8eefb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #64a8ff}button{border:0;border-radius:10px;padding:10px 14px;background:#1d3357;color:#eaf2ff}button:hover{background:#294a7b}.primary{background:#3c7df0;color:white}.primary:hover{background:#2b65d2}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:#0c1528;border-right:1px solid #23324b;padding:24px 14px;display:flex;flex-direction:column;gap:9px}.logo{font-size:19px;font-weight:800;padding:10px 12px 25px}.logo small{display:block;color:#84a7e8;font-size:11px;letter-spacing:2px;margin-top:5px}.nav{width:100%;text-align:left;background:transparent;color:#aebdd6;padding:13px}.nav.active{background:#1c3154;color:white}.bottom{margin-top:auto;font-size:12px;color:#8190aa;padding:10px}.main{padding:27px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:23px}h1{margin:0;font-size:26px;letter-spacing:-.7px}h2{font-size:17px;margin:0 0 14px}p{color:#9aacc8}.muted{color:#8ea0be}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:#111e33;border:1px solid #263650;border-radius:17px;padding:20px}.card b{display:block;font-size:29px;margin-top:9px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{margin-bottom:16px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #23324b}.line:last-child{border-bottom:0}.tag{font-size:11px;padding:5px 8px;background:#203b64;color:#a8d1ff;border-radius:20px}.warning{background:#503a21;color:#ffd292}.good{background:#194537;color:#8ce9b7}.toolbar{display:flex;gap:10px;margin-bottom:17px;flex-wrap:wrap}input,select lay:grid;gap:8px}.task{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #2b3c57;border-radius:10px}.task input{accent-color:#4d93f4}.danger{color:#ff9b9b}.hint{padding:12px;background:#192e4b;border-radius:12px;color:#b4c9e9;font-size:12px;line-height:1.6}.kpi{font-size:24px;font-weight:800}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{flex-direction:row;align-items:center;overflow:auto;padding:9px}.logo{padding:8px;font-size:14px;white-space:nowrap}.logo small,.bottom{display:none}.nav{white-space:nowrap;width:auto}.main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.detail{grid-template-columns:1fr}}@media(max-width:480px){.cards{gap:8px}.card{padding:12px}.card b{font-size:23px}.top{align-items:flex-start;flex-direction:column}.bubble{max-width:95%}}
</style><style>.install-banner{position:fixed;bottom:18px;right:18px;z-index:900;background:#14243d;border:1px solid #3b5474;border-radius:16px;padding:14px 18px;box-shadow:0 12px 35px #0009;max-width:min(380px,calc(100vw - 36px));color:#f5f8ff}.install-banner button{margin:8px 6px 0 0;background:#2476ef;color:white;border:0;border-radius:9px;padding:9px 13px}.install-banner button.secondary{background:#30425d}.install-banner p{font-size:12px;line-height:1.5;color:#c9d6e9}.offline-note{font-size:12px;color:#aebfd5}</style></head><body><div id="app"></div><script>
const KEY='baldecoos_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.cases))db={cases:[],payments:[],activity:[]};db.payments??=[];db.activity??=[];let view='dashboard',selected=null,tab='overview',filter='';const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=()=>new Date().toLocaleString('fr-FR'),money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0),fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR'): 'Non définie';function log(s){db.activity.unshift({text:s,date:date()});db.activity=db.activity.slice(0,100)}function current(){return db.cases.find(c=>c.id===selected)}function button(t,fn,cl=''){return `<button class="${cl}" onclick="${fn}">${t}</button>`}function go(v){view=v;selected=null;render()}function openCase(id){selected=id;view='detail';tab='overview';render()}function shell(content){$('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="logo">✦ Balde & Co<small>AGENCY OS</small></div>${[['dashboard','◫ Tableau de bord'],['cases','▤ Dossiers clients'],['tasks','✓ Tâches'],['finance','◈ Finances'],['insights','✧ Assistant']].map(([v,t])=>`<button class="nav ${view===v||(view==='detail'&&v==='cases')?'active':''}" onclick="go('${v}')">${t}</button>`).join('')}<div class="bottom">Version locale de démonstration<br>🔒 Aucune synchronisation cloud</div></aside><main class="main">${content}</main></div>`}function title(t,sub,extra=''){return `<div class="top"><div><h1>${t}</h1><p>${sub}</p></div>${extra}</div>`}function status(c){return `<span class="tag">${esc(c.stage)}</span>`}function summary(){const total=db.cases.length,active=db.cases.filter(c=>!['Clôturé','Annulé'].includes(c.stage)).length,due=db.cases.flatMap(c=>c.tasks||[]).filter(t=>!t.done).length,paid=db.payments.filter(p=>p.currency==='GNF').reduce((s,p)=>s+Number(p.amount),0);return `<div class="cards"><div class="card"><span class="muted">Clients</span><b>${total}</b></div><div class="card"><span class="muted">Dossiers actifs</span><b>${active}</b></div><div class="card"><span class="muted">Tâches ouvertes</span><b>${due}</b></div><div class="card"><span class="muted">Encaissements GNF</span><b>${money(paid)}</b></div></div>`}function dashboard(){shell(title('Vue d’ensemble','Votre agence, vos clients et vos priorités au même endroit',button('+ Nouveau dossier','newCase()','primary'))+summary()+`<div class="grid2"><section class="panel"><div class="sectionhead"><h2>Dossiers récents</h2>${button('Voir tout',"go('cases')")}</div>${db.cases.length?db.cases.slice().reverse().slice(0,6).map(c=>`<div class="line"><div><b>${esc(c.name)}</b><div class="muted small">${esc(c.service)} · ${esc(c.destination)}</div></div>${button('Ouvrir',`openCase('${c.id}')`)}</div>`).join(''):'<div class="empty">Aucun dossier. Créez votre premier client.</div>'}</section><section class="panel"><h2>Activité récente</h2>${db.activity.length?db.activity.slice(0,8).map(a=>`<div class="line"><div>${esc(a.text)}<div class="muted small">${esc(a.date)}</div></div></div>`).join(''):'<div class="empty">Les actions de l’équipe apparaîtront ici.</div>'}</section></div>`)}function cases(){const arr=db.cases.filter(c=>(c.name+' '+c.destination+' '+c.service+' '+c.stage).toLowerCase().includes(filter.toLowerCase()));shell(title('Dossiers clients','Chaque client dispose d’un espace complet',button('+ Nouveau dossier','newCase()','primary'))+`<div class="toolbar"><input id="search" placeholder="Rechercher un client, une destination, un statut..." value="${esc(filter)}" oninput="filter=this.value;updateCaseGrid()">${button('Exporter JSON','exportData()')}</div><div id="casegrid" class="casegrid">${caseCards(arr)}</div>`)}function caseCards(arr){return arr.length?arr.map(c=>`<article class="case" onclick="openCase('${c.id}')"><span class="avatar">${esc(c.name.slice(0,2).toUpperCase())}</span><h3>${esc(c.name)}</h3><p>${esc(c.service)} · ${esc(c.destination)}</p>${status(c)}<div class="progress"><span style="width:${stagePct(c.stage)}%"></span></div><div class="muted small">${(c.tasks||[]).filter(t=>!t.done).length} tâche(s) à traiter · ${(c.messages||[]).length} message(s)</div></article>`).join(''):'<div class="empty">Aucun dossier trouvé.</div>'}function updateCaseGrid(){const arr=db.cases.filter(c=>(c.name+' '+c.destination+' '+c.service+' '+c.stage).toLowerCase().includes(filter.toLowerCase()));$('#casegrid').innerHTML=caseCards(arr)}function stagePct(s){return {'Prospect':10,'Inscription':25,'Documents':40,'Candidatures':60,'Admission':75,'Visa':85,'Voyage':95,'Clôturé':100,'Annulé':0}[s]??15}function detail(){const c=current();if(!c)return go('cases');shell(`<div class="back">${button('← Tous les dossiers',"go('cases')")}</div>`+title(esc(c.name),`${esc(c.service)} · ${esc(c.destination)}`,button('Modifier le profil','editCase()'))+`<div class="detail"><aside><section class="panel"><span class="avatar">${esc(c.name.slice(0,2).toUpperCase())}</span><h2 style="margin-top:14px">${esc(c.name)}</h2><div class="muted">${esc(c.phone||'Téléphone non renseigné')}</div><div class="muted">${esc(c.email||'Email non renseigné')}</div><p>Responsable : ${esc(c.owner||'Non attribué')}</p>${status(c)}<div class="progress"><span style="width:${stagePct(c.stage)}%"></span></div><div class="field"><label>Étape du dossier</label><select id="stage" onchange="changeStage(this.value)">${['Prospect','Inscription','Documents','Candidatures','Admission','Visa','Voyage','Clôturé','Annulé'].map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Prochaine échéance</label><input type="date" value="${esc(c.deadline||'')}" onchange="changeDeadline(this.value)"></div></section><section class="panel"><h2>Fiche rapide</h2><div class="muted small">Créé le ${esc(c.created)}</div><p>${esc(c.notes||'Aucune information complémentaire.')}</p></section></aside><section class="panel"><div class="tabs">${[['overview','Vue 360°'],['chat','Conversations'],['tasks','Tâches'],['documents','Documents'],['finance','Paiements']].map(([v,t])=>`<button class="${tab===v?'active':''}" onclick="setTab('${v}')">${t}</button>`).join('')}</div><div id="tabcontent">${tabContent(c)}</div></section></div>`)}function setTab(v){tab=v;$('#tabcontent').innerHTML=tabContent(current())}function tabContent(c){if(tab==='overview')return `<h2>Chronologie du dossier</h2><div class="hint">Dossier ${esc(c.stage)} · Destination ${esc(c.destination)} · Responsable ${esc(c.owner||'à désigner')}. Utilisez les onglets pour suivre ce client sans mélanger ses échanges avec ceux des autres.</div><h2 style="margin-top:24px">Dernières conversations</h2>${(c.messages||[]).slice(-3).reverse().map(m=>`<div class="line"><div><b>${esc(m.author)}</b><div>${esc(m.text)}</div><div class="muted small">${esc(m.date)}</div></div></div>`).join('')||'<p>Aucun échange enregistré.</p>'}<h2 style="margin-top:22px">Actions à faire</h2>${taskList(c)}`;if(tab==='chat')return `<div class="sectionhead"><h2>Fil de discussion interne</h2><span class="tag">Notes de l’équipe</span></div><div class="chat" id="chat">${(c.messages||[]).map(m=>`<div class="bubble ${m.author==='Moi'?'me':''}"><small>${esc(m.author)} · ${esc(m.date)}</small>${esc(m.text)}</div>`).join('')||'<div class="empty">Démarrez une conversation interne liée à ce dossier.</div>'}</div><div class="compose"><textarea id="msg" placeholder="Écrire une note, un compte rendu ou une décision..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>${button('Envoyer','sendMessage()','primary')}</div><p class="small">Ces messages sont enregistrés sur cet appareil uniquement. Ce n’est pas encore une messagerie client en temps réel.</p>`;if(tab==='tasks')return `<div class="sectionhead"><h2>Tâches du dossier</h2>${button('+ Ajouter','addTask()','primary')}</div>${taskList(c)}`;if(tab==='documents')return `<div class="sectionhead"><h2>Liste des documents</h2>${button('+ Ajouter une référence','addDocument()','primary')}</div><div class="hint">Pour la confidentialité, cette version conserve uniquement les noms et statuts des documents, pas les fichiers personnels.</div>${(c.documents||[]).map((d,i)=>`<div class="line"><div>📄 ${esc(d.name)} <span class="tag">${esc(d.status)}</span></div>${button('Changer statut',`toggleDoc(${i})`)}</div>`).join('')||'<div class="empty">Aucun document répertorié.</div>'}`;if(tab==='finance')return `<div class="sectionhead"><h2>Paiements du client</h2>${button('+ Paiement','addPayment()','primary')}</div>${db.payments.filter(p=>p.caseId===c.id).map(p=>`<div class="line"><div><b>${money(p.amount)} ${esc(p.currency)}</b><div class="muted small">${esc(p.label)} · ${esc(p.date)}</div></div></div>`).join('')||'<div class="empty">Aucun paiement enregistré.</div>'}`}function taskList(c){return (c.tasks||[]).length?`<div class="tasks">${c.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${c.id}',${i})"><span style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.title)} <span class="muted small">${esc(t.due||'')}</span></span></label>`).join('')}</div>`:'<p>Aucune tâche enregistrée.</p>'}function changeStage(s){let c=current();c.stage=s;log('Étape modifiée : '+c.name+' → '+s);save();detail()}function changeDeadline(s){current().deadline=s;save()}function sendMessage(){let el=$('#msg'),v=el.value.trim();if(!v)return;current().messages.push({author:'Moi',text:v,date:date()});log('Note ajoutée : '+current().name);save();setTab('chat');$('#chat').scrollTop=$('#chat').scrollHeight}function toggleTask(id,i){const c=db.cases.find(c=>c.id===id);c.tasks[i].done=!c.tasks[i].done;save();render()}function toggleDoc(i){const d=current().documents[i];d.status=d.status==='Reçu'?'À fournir':'Reçu';save();setTab('documents')}function promptVal(label,def=''){let x=prompt(label,def);return x===null?null:x.trim()}function addTask(){const title=promptVal('Quelle tâche faut-il accomplir ?');if(!title)return;const due=promptVal('Échéance (AAAA-MM-JJ, facultatif)')||'';current().tasks.push({title,due,done:false});log('Tâche ajoutée : '+title);save();setTab('tasks')}function addDocument(){const name=promptVal('Nom du document (ex. Passeport, relevé de notes)');if(!name)return;current().documents.push({name,status:'À fournir'});save();setTab('documents')}function addPayment(){const amount=Number(promptVal('Montant du paiement'));if(!Number.isFinite(amount)||amount<=0)return alert('Montant invalide');const currency=promptVal('Devise (GNF, EUR...)','GNF')||'GNF';const label=promptVal('Motif du paiement','Accompagnement')||'Paiement';db.payments.push({id:uid(),caseId:selected,amount,currency:currency.toUpperCase(),label,date:date()});log('Paiement enregistré : '+current().name);save();setTab('finance')}function newCase(){modal(`<h2>Nouveau dossier client</h2>${caseForm()}<div class="actions">${button('Annuler','closeModal()')}${button('Créer le dossier','submitCase()','primary')}</div>`)}function editCase(){modal(`<h2>Modifier le profil</h2>${caseForm(current())}<div class="actions">${button('Annuler','closeModal()')}${button('Enregistrer','submitCase(true)','primary')}</div>`)}function caseForm(c={}){return [['name','Nom complet','text'],['phone','Téléphone','text'],['email','Email','email'],['destination','Destination','text'],['owner','Agent responsable','text'],['notes','Informations utiles','textarea']].map(([k,l,t])=>`<div class="field"><label>${l}</label>${t==='textarea'?`<textarea id="f_${k}">${esc(c[k]||'')}</textarea>`:`<input id="f_${k}" type="${t}" value="${esc(c[k]||'')}">`}</div>`).join('')+`<div class="field"><label>Service</label><select id="f_service">${['Études à l’étranger','Visa','Billetterie','Voyage / Tourisme','Omra','Autre'].map(s=>`<option ${c.service===s?'selected':''}>${s}</option>`).join('')}</select></div>`}function submitCase(edit=false){const c=edit?current():{id:uid(),created:date(),stage:'Prospect',tasks:[],messages:[],documents:[]};for(const k of ['name','phone','email','destination','owner','notes','service'])c[k]=$('#f_'+k).value.trim();if(!c.name)return alert('Le nom est obligatoire');if(!edit)db.cases.push(c);log((edit?'Profil modifié : ':'Nouveau dossier : ')+c.name);save();closeModal();openCase(c.id)}function modal(html){const d=document.createElement('div');d.className='modalback';d.id='modal';d.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(d)}function closeModal(){$('#modal')?.remove()}function tasksPage(){let list=db.cases.flatMap(c=>(c.tasks||[]).map((t,i)=>({c,t,i})));shell(title('Centre des tâches','Toutes les actions de l’agence')+`<section class="panel"><h2>${list.filter(x=>!x.t.done).length} tâche(s) en attente</h2>${list.length?list.map(({c,t,i})=>`<div class="line"><label class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${c.id}',${i})"><span>${esc(t.title)} <span class="muted small">${esc(t.due)}</span></span></label>${button(esc(c.name),`openCase('${c.id}')`)}</div>`).join(''):'<div class="empty">Ajoutez des tâches depuis les dossiers clients.</div>'}</section>`)}function finance(){let sums={};for(let p of db.payments)sums[p.currency]=(sums[p.currency]||0)+Number(p.amount);shell(title('Finances','Encaissements enregistrés par devise')+`<div class="cards">${Object.entries(sums).map(([cur,sum])=>`<div class="card"><span class="muted">${esc(cur)}</span><b>${money(sum)}</b></div>`).join('')||'<div class="card">Aucun encaissement</div>'}</div><section class="panel"><h2>Historique des paiements</h2>${db.payments.slice().reverse().map(p=>`<div class="line"><div><b>${money(p.amount)} ${esc(p.currency)}</b><div class="muted small">${esc(db.cases.find(c=>c.id===p.caseId)?.name||'Client supprimé')} · ${esc(p.label)} · ${esc(p.date)}</div></div></div>`).join('')||'<div class="empty">Aucun paiement enregistré.</div>'}</section>`)}function insights(){const late=db.cases.flatMap(c=>(c.tasks||[]).filter(t=>!t.done&&t.due&&t.due<new Date().toISOString().slice(0,10)).map(t=>({c,t})));const withoutOwner=db.cases.filter(c=>!c.owner);const withoutDeadline=db.cases.filter(c=>!c.deadline&&c.stage!=='Clôturé');shell(title('Assistant de pilotage','Alertes calculées à partir des dossiers — sans IA externe')+`<div class="grid2"><section class="panel"><h2>Points de vigilance</h2><div class="line">⚠️ ${late.length} tâche(s) en retard</div><div class="line">👤 ${withoutOwner.length} dossier(s) sans responsable</div><div class="line">📅 ${withoutDeadline.length} dossier(s) sans échéance</div></section><section class="panel"><h2>Recommandations</h2><div class="hint">${late.length?'Traitez les tâches en retard en priorité.':'Aucune tâche en retard détectée.'}<br>${withoutOwner.length?'Attribuez un agent à chaque dossier.':'Les dossiers ont un responsable.'}<br>${withoutDeadline.length?'Ajoutez des échéances aux dossiers en cours.':'Les échéances sont renseignées.'}</div></section></div><section class="panel"><h2>Assistant IA conversationnel — prochaine version</h2><p>Une IA connectée pourra analyser le dossier ouvert, résumer les échanges, préparer les lettres et suggérer les prochaines étapes. Cette version ne simule pas de réponses IA.</p></section>`)}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='balde-co-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function render(){if(view==='dashboard')dashboard();else if(view==='cases')cases();else if(view==='detail')detail();else if(view==='tasks')tasksPage();else if(view==='finance')finance();else insights()}render();
